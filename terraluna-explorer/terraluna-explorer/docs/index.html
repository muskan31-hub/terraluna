// ---- lib/api.js ----
// Live public APIs used directly from the browser (CORS-enabled, no API key):
//   - NASA GIBS WMTS tiles
//   - NASA POWER monthly point API (https://power.larc.nasa.gov)
//   - NASA CMR collection search (https://cmr.earthdata.nasa.gov)

function isoDate(d) {
  return d.toISOString().slice(0, 10);
}

function defaultDate() {
  const d = new Date();
  d.setUTCDate(d.getUTCDate() - 4); // GIBS daily products are typically available within a few days
  return isoDate(d);
}

function yearAgo(dateStr) {
  const d = new Date(dateStr + 'T00:00:00Z');
  d.setUTCFullYear(d.getUTCFullYear() - 1);
  return isoDate(d);
}

function gibsUrl(l, date) {
  const t = l.timeBased ? date : 'default';
  return `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${l.layer}/default/${t}/${l.matrix}/{z}/{y}/{x}.${l.ext}`;
}

function worldviewLink(l, date) {
  return `https://worldview.earthdata.nasa.gov/?l=${l.layer}&t=${date}`;
}

async function getJson(url, timeoutMs = 25000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { signal: ctrl.signal });
    if (!res.ok) throw new Error(`Request failed (${res.status} ${res.statusText})`);
    return await res.json();
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('The request timed out. The data service may be busy.');
    throw e;
  } finally {
    clearTimeout(timer);
  }
}

// NASA POWER monthly climatology at a point. Returns rows of { date, year, month, t2m, precip }.
async function fetchPower(lat, lon, startYear = 2015, endYear = 2024) {
  const url =
    'https://power.larc.nasa.gov/api/temporal/monthly/point' +
    `?parameters=T2M,PRECTOTCORR&community=RE&longitude=${lon}&latitude=${lat}` +
    `&start=${startYear}&end=${endYear}&format=JSON`;
  const json = await getJson(url);
  const p = json?.properties?.parameter;
  if (!p || !p.T2M) throw new Error('NASA POWER returned no data for this location.');
  const rows = [];
  for (const key of Object.keys(p.T2M)) {
    const year = Number(key.slice(0, 4));
    const month = Number(key.slice(4));
    if (month < 1 || month > 12) continue; // month 13 is the annual mean
    const t = p.T2M[key];
    const r = p.PRECTOTCORR ? p.PRECTOTCORR[key] : null;
    rows.push({
      date: `${year}-${String(month).padStart(2, '0')}`,
      year,
      month,
      t2m: t === -999 || t == null ? null : Number(t),
      precip: r === -999 || r == null ? null : Number(r),
    });
  }
  const units = json?.parameters || {};
  return {
    rows,
    meta: {
      dataset: 'NASA POWER Monthly (MERRA-2 / CERES-based, community RE)',
      source: 'https://power.larc.nasa.gov',
      apiUrl: url,
      startYear,
      endYear,
      lat,
      lon,
      units: {
        t2m: units.T2M?.units || 'C',
        precip: units.PRECTOTCORR?.units || 'mm/day',
      },
      retrieved: new Date().toISOString(),
    },
  };
}

// NASA CMR collection search (the engine behind Earthdata Search).
async function searchCmr(keyword) {
  const url = `https://cmr.earthdata.nasa.gov/search/collections.json?keyword=${encodeURIComponent(keyword)}&page_size=8&sort_key=-usage_score`;
  const json = await getJson(url);
  const entries = json?.feed?.entry || [];
  return entries.map((e) => ({
    id: e.id,
    title: e.title,
    shortName: e.short_name,
    version: e.version_id,
    center: e.data_center,
    start: e.time_start ? e.time_start.slice(0, 10) : null,
    end: e.time_end ? e.time_end.slice(0, 10) : 'ongoing',
    link: `https://cmr.earthdata.nasa.gov/search/concepts/${e.id}.html`,
    search: `https://search.earthdata.nasa.gov/search?q=${encodeURIComponent(e.short_name || e.title)}`,
  }));
}

function mean(arr) {
  const v = arr.filter((x) => x != null && !Number.isNaN(x));
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
}
function minOf(arr) {
  const v = arr.filter((x) => x != null && !Number.isNaN(x));
  return v.length ? Math.min(...v) : null;
}
function maxOf(arr) {
  const v = arr.filter((x) => x != null && !Number.isNaN(x));
  return v.length ? Math.max(...v) : null;
}

function toCsv(rows, meta) {
  const head = [
    `# ${meta.dataset}`,
    `# Source: ${meta.source}`,
    `# Location: lat ${meta.lat}, lon ${meta.lon}`,
    `# Period: ${meta.startYear}-${meta.endYear}`,
    `# Units: T2M (${meta.units.t2m}), PRECTOTCORR (${meta.units.precip})`,
    `# Retrieved: ${meta.retrieved}`,
    'month,T2M,PRECTOTCORR',
  ];
  const lines = rows.map((r) => `${r.date},${r.t2m ?? ''},${r.precip ?? ''}`);
  return head.concat(lines).join('\n');
}

function downloadText(filename, text, mime = 'text/csv') {
  const blob = new Blob([text], { type: mime });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const STOP = new Set(['the', 'a', 'an', 'is', 'are', 'of', 'in', 'on', 'to', 'and', 'what', 'how', 'why', 'does', 'do', 'it', 'me', 'tell', 'about', 'can', 'you', 'for', 'with', 'this', 'that']);

function tokens(text) {
  return text.toLowerCase().replace(/[^a-z0-9.\-\s]/g, ' ').split(/\s+/).filter((t) => t && !STOP.has(t));
}

function answerFromKb(question) {
  const q = question.toLowerCase();
  const toks = tokens(question);
  let best = null;
  let bestScore = 0;
  for (const e of KB) {
    let s = 0;
    for (const k of e.kw) {
      if (q.includes(k)) s += k.includes(' ') ? 3 : 2;
      else if (toks.some((t) => t.length > 3 && k.includes(t))) s += 1;
    }
    if (s > bestScore) { bestScore = s; best = e; }
  }
  return bestScore >= 2 ? best : null;
}

function Starfield() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current;
    const ctx = c.getContext('2d');
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let raf;
    let w = 0;
    let h = 0;
    let stars = [];
    const init = () => {
      w = c.width = window.innerWidth;
      h = c.height = window.innerHeight;
      const n = Math.min(260, Math.floor((w * h) / 6500));
      stars = Array.from({ length: n }, () => ({
        x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.3 + 0.2,
        p: Math.random() * 6.28, s: Math.random() * 0.02 + 0.005, d: Math.random() * 0.12 + 0.02,
      }));
    };
    const draw = () => {
      ctx.clearRect(0, 0, w, h);
      for (const s of stars) {
        if (!reduce) { s.p += s.s; s.y += s.d * 0.12; if (s.y > h) s.y = 0; }
        ctx.globalAlpha = 0.3 + 0.7 * Math.abs(Math.sin(s.p));
        ctx.fillStyle = '#cfe8ff';
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, 6.283);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      if (!reduce) raf = requestAnimationFrame(draw);
    };
    init();
    draw();
    window.addEventListener('resize', init);
    return () => { cancelAnimationFrame(raf); window.removeEventListener('resize', init); };
  }, []);
  return <canvas ref={ref} className="fixed inset-0 -z-10 pointer-events-none" aria-hidden="true" />;
}

const DATASET_QUERIES = [
  'MODIS land surface temperature',
  'MODIS NDVI vegetation',
  'GPM IMERG precipitation',
  'snow cover',
  'sea ice concentration',
];

function EarthExplorer({ point, setPoint }) {
  const mapEl = useRef(null);
  const mapRef = useRef(null);
  const layerRef = useRef(null);
  const cmpRef = useRef(null);
  const markerRef = useRef(null);
  const errRef = useRef(0);

  const [layerId, setLayerId] = useState('truecolor');
  const [date, setDate] = useState(defaultDate());
  const [opacity, setOpacity] = useState(0.9);
  const [cmpOn, setCmpOn] = useState(false);
  const [cmpDate, setCmpDate] = useState(yearAgo(defaultDate()));
  const [blend, setBlend] = useState(0.5);
  const [loading, setLoading] = useState(true);
  const [tileErrors, setTileErrors] = useState(0);

  const [query, setQuery] = useState(DATASET_QUERIES[0]);
  const [cmr, setCmr] = useState({ status: 'idle', items: [], error: null });

  const layer = GIBS_LAYERS.find((l) => l.id === layerId);
  const today = isoDate(new Date());

  // Create the map once.
  useEffect(() => {
    const map = L.map(mapEl.current, { center: [25, 10], zoom: 3, minZoom: 2, maxZoom: 9, worldCopyJump: true });
    L.tileLayer(gibsUrl(GIBS_BASE, null), {
      maxNativeZoom: GIBS_BASE.maxZoom, maxZoom: 9,
      attribution: 'Basemap: NASA GIBS Blue Marble · <a href="https://earthdata.nasa.gov/gibs" target="_blank" rel="noopener noreferrer">NASA GIBS</a>',
    }).addTo(map);
    map.on('click', (e) => {
      const lon = ((((e.latlng.lng + 180) % 360) + 360) % 360) - 180;
      setPoint({ lat: Number(e.latlng.lat.toFixed(2)), lon: Number(lon.toFixed(2)), name: 'Map selection' });
    });
    mapRef.current = map;
    return () => map.remove();
  }, []);

  // Show a marker for the selected point.
  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    if (markerRef.current) markerRef.current.remove();
    markerRef.current = L.circleMarker([point.lat, point.lon], { radius: 8, color: '#22d3ee', weight: 2, fillColor: '#8b5cf6', fillOpacity: 0.85 })
      .addTo(map)
      .bindTooltip(`${point.name} (${point.lat}, ${point.lon})`);
  }, [point]);

  // Main data layer.
  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    if (layerRef.current) layerRef.current.remove();
    errRef.current = 0;
    setTileErrors(0);
    setLoading(true);
    const tl = L.tileLayer(gibsUrl(layer, date), { maxNativeZoom: layer.maxZoom, maxZoom: 9, opacity, attribution: 'Data: NASA GIBS / ' + layer.instrument });
    tl.on('loading', () => setLoading(true));
    tl.on('load', () => setLoading(false));
    tl.on('tileerror', () => { errRef.current += 1; if (errRef.current === 6) setTileErrors(6); });
    tl.addTo(map);
    layerRef.current = tl;
  }, [layerId, date]);

  useEffect(() => { if (layerRef.current) layerRef.current.setOpacity(opacity); }, [opacity]);

  // Optional comparison layer: same product, different date, blended on top.
  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    if (cmpRef.current) { cmpRef.current.remove(); cmpRef.current = null; }
    if (!cmpOn) return;
    const tl = L.tileLayer(gibsUrl(layer, cmpDate), { maxNativeZoom: layer.maxZoom, maxZoom: 9, opacity: blend });
    tl.addTo(map);
    cmpRef.current = tl;
  }, [cmpOn, cmpDate, layerId]);

  useEffect(() => { if (cmpRef.current) cmpRef.current.setOpacity(blend); }, [blend]);

  function flyTo(p) {
    setPoint({ lat: p.lat, lon: p.lon, name: p.name });
    if (mapRef.current) mapRef.current.flyTo([p.lat, p.lon], 5, { duration: 1.4 });
  }

  async function runSearch(q) {
    setQuery(q);
    setCmr({ status: 'loading', items: [], error: null });
    try {
      const items = await searchCmr(q);
      setCmr({ status: 'done', items, error: null });
    } catch (e) {
      setCmr({ status: 'error', items: [], error: e.message });
    }
  }

  return (
    <div>
      <SectionTitle eyebrow="Earth Explorer" title="Earth from orbit">
        Live NASA GIBS satellite imagery. Choose a theme and a date, blend two dates to look for change, and click anywhere to select a location for the Dashboard.
      </SectionTitle>

      <div className="grid gap-5 lg:grid-cols-[320px_1fr]">
        <div className="space-y-4">
          <Glass className="p-4">
            <div className="text-sm font-semibold text-white">Theme</div>
            <div className="mt-3 flex flex-wrap gap-2">
              {GIBS_LAYERS.map((l) => (
                <button key={l.id} className={`chip ${l.id === layerId ? 'chip-on' : ''}`} onClick={() => setLayerId(l.id)}>{l.label}</button>
              ))}
            </div>
            <div className="mt-4 text-xs text-slate-300">{layer.desc}</div>
            <dl className="mt-3 space-y-1 text-xs text-slate-400">
              <div><dt className="inline text-slate-500">Units: </dt><dd className="inline">{layer.unit}</dd></div>
              <div><dt className="inline text-slate-500">Instrument: </dt><dd className="inline">{layer.instrument}</dd></div>
              <div><dt className="inline text-slate-500">GIBS layer: </dt><dd className="inline break-all">{layer.layer}</dd></div>
            </dl>

function PolarPlot({ selected, onSelect }) {
  // Azimuthal view of the south pole. Radius = angular distance from the pole; angle = longitude.
  const size = 320;
  const c = size / 2;
  const maxDeg = 10; // show from -80 to the pole
  const scale = (c - 16) / maxDeg;
  const pos = (lat, lon) => {
    const r = (90 - Math.abs(lat)) * scale;
    const a = ((lon - 90) * Math.PI) / 180;
    return [c + r * Math.cos(a), c + r * Math.sin(a)];
  };
  return (
    <svg viewBox={`0 0 ${size} ${size}`} className="mx-auto w-full max-w-sm" role="img" aria-label="South polar map of crater locations">
      <circle cx={c} cy={c} r={c - 6} fill="#050816" stroke="#334155" />
      {[2, 4, 6, 8, 10].map((d) => (
        <g key={d}>
          <circle cx={c} cy={c} r={d * scale} fill="none" stroke="#1e293b" strokeDasharray="3 4" />
          <text x={c + 4} y={c - d * scale + 11} fontSize="9" fill="#64748b">{90 - d}°S</text>
        </g>
      ))}
      <line x1={c} y1={8} x2={c} y2={size - 8} stroke="#1e293b" />
      <line x1={8} y1={c} x2={size - 8} y2={c} stroke="#1e293b" />
      <text x={c} y={14} fontSize="9" fill="#64748b" textAnchor="middle">90°E</text>
      <text x={size - 12} y={c - 4} fontSize="9" fill="#64748b" textAnchor="end">180°</text>
      <text x={c} y={size - 5} fontSize="9" fill="#64748b" textAnchor="middle">90°W</text>
      <text x={12} y={c - 4} fontSize="9" fill="#64748b">0°</text>
      {MOON_SITES.map((s) => {
        const [x, y] = pos(s.lat, s.lon);
        const on = selected === s.name;
        const rr = Math.max(4, (s.km / 111) * scale * 0.9);
        return (
          <g key={s.name} className="cursor-pointer" onClick={() => onSelect(s.name)}>
            <circle cx={x} cy={y} r={rr} fill={on ? 'rgba(167,139,250,.45)' : 'rgba(34,211,238,.25)'} stroke={on ? '#a78bfa' : '#22d3ee'} strokeWidth="1.5" />
            <text x={x + rr + 3} y={y + 3} fontSize="9.5" fill="#e2e8f0">{s.name}</text>
          </g>
        );
      })}
    </svg>
  );
}

function MoonExplorer() {
  const mapEl = useRef(null);

  const markersRef = useRef({});
  const errRef = useRef(0);

  const [layerId, setLayerId] = useState('wac');
  const [loading, setLoading] = useState(true);
  const [tileErrors, setTileErrors] = useState(0);
  const [site, setSite] = useState('Shackleton');

  const layer = MOON_LAYERS.find((l) => l.id === layerId);
  const siteInfo = MOON_SITES.find((s) => s.name === site);

  useEffect(() => {
    // Geographic (plate carrée) projection, matching NASA Moon Trek's equirectangular tile sets.
    const map = L.map(mapEl.current, { crs: L.CRS.EPSG4326, center: [-60, 0], zoom: 2, minZoom: 1, maxZoom: 8, maxBounds: [[-95, -190], [95, 190]] });
    mapRef.current = map;
    MOON_SITES.forEach((s) => {
      const m = L.circleMarker([s.lat, s.lon], { radius: 7, color: '#a78bfa', weight: 2, fillColor: '#22d3ee', fillOpacity: 0.7 }).addTo(map);
      m.bindPopup(`<strong>${s.name}</strong> (~${s.km} km)<br/>${s.lat}°, ${s.lon}°<br/><span style="font-size:12px">${s.note}</span>`);
      m.on('click', () => setSite(s.name));
      markersRef.current[s.name] = m;
    });
    return () => map.remove();
  }, []);

  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    if (layerRef.current) layerRef.current.remove();
    errRef.current = 0;
    setTileErrors(0);
    setLoading(true);
    // Trek's level 0 tile covers 180°, Leaflet's EPSG:4326 level 0 covers 360°, hence zoomOffset -1.
    const tl = L.tileLayer(layer.url, {

    tl.on('load', () => setLoading(false));
    tl.on('tileerror', () => { errRef.current += 1; if (errRef.current === 6) setTileErrors(6); });
    tl.addTo(map);

// Illustrative model ONLY. Anchored to two published Diviner values; the curve between them is a simple
// radiative-equilibrium shape (T ~ T_noon * cos(hour angle)^0.25), not a measurement.
function diurnalModel(tNoon, tNight) {
  const pts = [];
  for (let d = 0; d <= 29.5; d += 0.5) {
    const h = ((d / 29.5) * 360 - 180); // local hour angle in degrees, noon at the middle of the cycle
    const c = Math.cos((h * Math.PI) / 180);
    const t = c > 0 ? Math.max(tNight, tNoon * Math.pow(c, 0.25)) : tNight;
    pts.push({ day: d, k: Math.round(t) });
  }
  return pts;
}

function Dashboard({ point, setPoint, power, setPower }) {
  const [state, setState] = useState({ status: power ? 'done' : 'idle', error: null });
  const [lat, setLat] = useState(String(point.lat));
  const [lon, setLon] = useState(String(point.lon));
  const [series, setSeries] = useState('t2m');

  useEffect(() => { setLat(String(point.lat)); setLon(String(point.lon)); }, [point]);

  async function load(p) {
    const la = Number(p.lat);
    const lo = Number(p.lon);
    if (!(la >= -90 && la <= 90) || !(lo >= -180 && lo <= 180)) {
      setState({ status: 'error', error: 'Latitude must be between -90 and 90 and longitude between -180 and 180.' });
      return;
    }
    setState({ status: 'loading', error: null });
    try {
      const res = await fetchPower(la, lo);
      setPower({ ...res, name: p.name || 'Custom location' });
      setState({ status: 'done', error: null });
    } catch (e) {
      setState({ status: 'error', error: e.message });
    }
  }

  const rows = power ? power.rows : [];
  const meta = power ? power.meta : null;

  const climatology = useMemo(() => {
    if (!rows.length) return [];
    return MONTHS.map((m, i) => {
      const r = rows.filter((x) => x.month === i + 1);
      return {
        month: m,
        t2m: mean(r.map((x) => x.t2m)) == null ? null : Number(mean(r.map((x) => x.t2m)).toFixed(2)),
        precip: mean(r.map((x) => x.precip)) == null ? null : Number(mean(r.map((x) => x.precip)).toFixed(2)),

    });
  }, [rows]);

  const t = rows.map((r) => r.t2m);
  const pr = rows.map((r) => r.precip);

  return (
    <div>

      <div className="mt-5">

const SUGGESTIONS = [
  'What is Diviner and what did it measure?',
  'Why are lunar polar craters so cold?',
  'Is there water ice on the Moon?',
  'What is the difference between air and surface temperature?',
  'What does NDVI tell us?',
  'Summarize the data I loaded in the Dashboard',
];

function summarizePower(power) {
  const { rows, meta, name } = power;
  const t = rows.map((r) => r.t2m);
  const p = rows.map((r) => r.precip);
  const warm = rows.reduce((a, b) => (b.t2m != null && (a == null || b.t2m > a.t2m) ? b : a), null);
  const cold = rows.reduce((a, b) => (b.t2m != null && (a == null || b.t2m < a.t2m) ? b : a), null);
  const u = meta.units.t2m === 'C' ? '°C' : meta.units.t2m;
  const lines = [
    `For ${name} (${meta.lat}°, ${meta.lon}°), NASA POWER monthly data for ${meta.startYear}–${meta.endYear} show a mean 2 m air temperature of ${mean(t).toFixed(1)} ${u}.`,
    warm && cold ? `The warmest month in the record was ${warm.date} (${warm.t2m.toFixed(1)} ${u}) and the coldest was ${cold.date} (${cold.t2m.toFixed(1)} ${u}).` : '',
    mean(p) != null ? `Mean precipitation was ${mean(p).toFixed(2)} ${meta.units.precip}, with monthly values from ${minOf(p).toFixed(2)} to ${maxOf(p).toFixed(2)} ${meta.units.precip}.` : '',
    'These are grid-cell values from a reanalysis product and describe what is in the loaded data only. I cannot say from this alone whether the climate there is changing.',
  ];
  return lines.filter(Boolean).join(' ');
}

function Assistant({ power }) {
  const [msgs, setMsgs] = useState([
    { role: 'bot', text: 'Hi! I answer questions about satellite observations of Earth and the Moon. I only use cited sources and the data you have loaded, so if I do not have a sourced answer I will say so instead of guessing.', src: [] },
  ]);
  const [input, setInput] = useState('');
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, [msgs]);

  function ask(q) {
    const text = q.trim();
    if (!text) return;
    const lower = text.toLowerCase();
    let reply;
    if (/(summar|loaded|my data|dashboard|pattern)/.test(lower) && /(data|loaded|dashboard|summar|pattern)/.test(lower)) {
      if (power) {
        reply = { role: 'bot', text: summarizePower(power), src: [['NASA POWER', 'https://power.larc.nasa.gov']], tag: 'Computed from your loaded data' };
      } else {
        reply = { role: 'bot', text: 'No data is loaded yet. Open the Dashboard, pick a place and press Load data, then ask me again and I will summarize it.', src: [] };
      }
    } else {
      const hit = answerFromKb(text);
      if (hit) {
        reply = { role: 'bot', text: hit.a, src: hit.src, tag: 'From cited sources' };
      } else {
        reply = {
          role: 'bot',
          text: 'I do not have a sourced answer for that, and I will not guess at measurements. You could try asking about Diviner, polar craters, lunar ice, land surface temperature, NDVI, rainfall or the data sources. For primary data, search NASA Earthdata or the Planetary Data System.',
          src: [['NASA Earthdata Search', 'https://search.earthdata.nasa.gov'], ['NASA PDS', 'https://pds.nasa.gov']],
        };
      }
    }
    setMsgs((m) => [...m, { role: 'user', text }, reply]);
    setInput('');
  }

  return (
    <div>
      <SectionTitle eyebrow="AI Science Assistant" title="Ask about the observations">
        Plain-language answers grounded in cited sources and in the data you load. It never makes up measurements.
      </SectionTitle>

      <div className="grid gap-5 lg:grid-cols-[1fr_300px]">
        <Glass className="flex h-[65vh] min-h-[420px] flex-col p-4">
          <div className="flex-1 space-y-3 overflow-y-auto pr-1" aria-live="polite">
            {msgs.map((m, i) => (
              <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                <div className={`max-w-[88%] rounded-2xl px-4 py-3 text-sm ${m.role === 'user' ? 'bg-gradient-to-r from-cyan-600/70 to-blue-600/70 text-white' : 'border border-white/10 bg-white/5 text-slate-200'}`}>
                  <div>{m.text}</div>
                  {m.tag && <div className="mt-2"><span className="rounded-full border border-cyan-400/40 bg-cyan-500/10 px-2 py-0.5 text-[10px] text-cyan-200">{m.tag}</span></div>}
                  {m.src && m.src.length > 0 && (
                    <div className="mt-2 text-xs text-slate-400">
                      Sources: {m.src.map((s, j) => (
                        <span key={j}>{j > 0 && ' · '}{s[1].startsWith('#') ? <a className="text-cyan-300 underline" href={s[1]}>{s[0]}</a> : <ExtLink href={s[1]}>{s[0]}</ExtLink>}</span>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            ))}
            <div ref={endRef} />
          </div>
          <form className="mt-3 flex gap-2" onSubmit={(e) => { e.preventDefault(); ask(input); }}>
            <input className="field flex-1 !py-2.5" placeholder="Ask about Diviner, lunar ice, NDVI, rainfall…" value={input} onChange={(e) => setInput(e.target.value)} aria-label="Your question" />
            <button className="btn btn-earth !py-2.5" type="submit">Ask</button>
          </form>
        </Glass>

        <div className="space-y-4">
          <Glass className="p-4">
            <div className="text-sm font-semibold text-white">Try asking</div>
            <div className="mt-3 flex flex-col gap-2">
              {SUGGESTIONS.map((s) => <button key={s} className="chip text-left" onClick={() => ask(s)}>{s}</button>)}
            </div>
          </Glass>
          <Glass className="p-4 text-xs text-slate-300">
            <div className="mb-2 flex items-center gap-2 text-sm font-semibold text-white">How it stays honest</div>
            <ul className="list-disc space-y-1 pl-4">
              <li>Answers come from a curated, cited knowledge base.</li>
              <li>Data summaries are computed from what you loaded, not recalled.</li>
              <li>No match means it says so.</li>
              <li>Measurements and interpretations are named as such.</li>
            </ul>
            <div className="mt-3 flex items-center gap-2">{power ? <Badge kind="live" /> : <Badge kind="link" />}<span>{power ? `Data loaded: ${power.name}` : 'No dashboard data loaded'}</span></div>
          </Glass>
        </div>
      </div>
    </div>
  );
}

      </section>

      <section className="mt-8">
        <h2 className="text-2xl font-bold text-white">Scientific references</h2>
        <ul className="mt-3 space-y-2 text-sm text-slate-300">
          {CITATIONS.map((c) => (
            <li key={c[1]}>{c[0]} <ExtLink href={c[1]}>Link ↗</ExtLink></li>
          ))}
        </ul>
      </section>

      <section className="mt-8">
        <Glass className="p-5">
          <h2 className="text-xl font-bold text-white">Attribution and acknowledgements</h2>
          <p className="mt-2 text-sm text-slate-300">
            Imagery courtesy of NASA Global Imagery Browse Services (GIBS), NASA EOSDIS and the MODIS and GPM science teams. Lunar imagery and elevation courtesy of NASA/GSFC/Arizona State University (LROC) and NASA Moon Trek. Climate data from the NASA Langley Research Center POWER Project. Maps by Leaflet. Charts by Recharts.
          </p>
          <p className="mt-2 text-sm text-slate-300">
            ESA Copernicus Sentinel data, CSA RADARSAT data and JAXA satellite data are credited to their agencies and remain subject to their own terms of use. Built for the NASA International Space Apps Challenge. This is an educational project; it is not an official product of NASA, ESA, CSA or JAXA, and use of agency data does not imply endorsement.
          </p>
        </Glass>
      </section>
    </div>
  );
}

// ---- App.jsx ----

const ROUTES = [
  { path: '/', label: 'Home' },
  { path: '/earth', label: 'Earth' },
  { path: '/moon', label: 'Moon' },
  { path: '/compare', label: 'Compare' },
  { path: '/dashboard', label: 'Dashboard' },
  { path: '/assistant', label: 'AI Assistant' },
  { path: '/about', label: 'About' },
];

function currentPath() {
  const p = window.location.hash.replace(/^#/, '') || '/';
  return ROUTES.some((r) => r.path === p) ? p : '/';
}

function App() {
  const [route, setRoute] = useState(currentPath());
  const [menuOpen, setMenuOpen] = useState(false);
  // Shared state: the location the user picked on the Earth map, and the latest NASA POWER data loaded.
  const [point, setPoint] = useState({ lat: -78.46, lon: 106.84, name: 'Vostok Station' });
  const [power, setPower] = useState(null);

  useEffect(() => {
    const onHash = () => { setRoute(currentPath()); setMenuOpen(false); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  let page = null;
  if (route === '/') page = <Home />;
  else if (route === '/earth') page = <EarthExplorer point={point} setPoint={setPoint} />;
  else if (route === '/moon') page = <MoonExplorer />;
  else if (route === '/compare') page = <Compare />;
  else if (route === '/dashboard') page = <Dashboard point={point} setPoint={setPoint} power={power} setPower={setPower} />;
  else if (route === '/assistant') page = <Assistant power={power} />;
  else page = <About />;

  return (
    <div className="relative min-h-screen">
      <Starfield />
      <header className="sticky top-0 z-[1000] border-b border-white/10 bg-[#050816]/75 backdrop-blur-lg">
        <nav className="mx-auto flex max-w-7xl items-center justify-between px-4 py-3" aria-label="Main">
          <a href="#/" className="flex items-center gap-2 text-white no-underline">
            <Logo />
            <span className="text-lg font-bold tracking-wide">Terra<span className="gradient-text">Luna</span></span>
          </a>
          <button className="chip md:hidden" onClick={() => setMenuOpen((o) => !o)} aria-expanded={menuOpen} aria-label="Toggle menu">
            {menuOpen ? 'Close' : 'Menu'}
          </button>
          <ul className="hidden items-center gap-1 md:flex">
            {ROUTES.map((r) => (
              <li key={r.path}>
                <a href={'#' + r.path}
                  className={`rounded-full px-3.5 py-1.5 text-sm no-underline transition ${route === r.path ? 'bg-cyan-400/15 text-cyan-200' : 'text-slate-300 hover:bg-white/5 hover:text-white'}`}>
                  {r.label}
                </a>
              </li>
            ))}
          </ul>
        </nav>
        {menuOpen && (
          <ul className="flex flex-col gap-1 border-t border-white/10 px-4 py-3 md:hidden">
            {ROUTES.map((r) => (
              <li key={r.path}>
                <a href={'#' + r.path} className={`block rounded-lg px-3 py-2 no-underline ${route === r.path ? 'bg-cyan-400/15 text-cyan-200' : 'text-slate-300'}`}>{r.label}</a>
              </li>
            ))}
          </ul>
        )}
      </header>

      <main className="mx-auto max-w-7xl px-4 pb-20 pt-8">{page}</main>

      <footer className="border-t border-white/10 px-4 py-8 text-center text-xs text-slate-400">
        TerraLuna Explorer · Built for the NASA International Space Apps Challenge · Imagery and data courtesy of NASA, ESA, CSA and JAXA open data programs.
        <div className="mt-1">This is an educational project and is not an official product of any space agency.</div>
      </footer>
    </div>
  );
}

// ---- main.jsx ----

createRoot(document.getElementById('root')).render(<App />);
})();

</script>
</body>
</html>
